<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Демо: Академия знаний — Minecraft-стиль на PlayCanvas</title>
<style>
:root{--gold:#d9a441;--green:#6f9a5d;--blue:#8fc4d6;--ink:#3b2d20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);background:#0e1420}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.8);border-radius:50%;box-shadow:0 0 10px rgba(255,255,255,.4)}
.hotbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:rgba(20,20,20,.55);border:2px solid rgba(255,255,255,.25);border-radius:10px;backdrop-filter:blur(4px)}
.slot{width:56px;height:56px;border:2px solid rgba(255,255,255,.35);border-radius:8px;display:grid;place-items:center;position:relative;background:rgba(0,0,0,.35)}
.slot .icon{width:34px;height:34px;border-radius:6px}
.slot .count{position:absolute;right:4px;bottom:2px;font:700 14px/1 'Marcellus',serif;color:#fff;text-shadow:0 1px 2px #000}
.slot.active{border-color:var(--gold);box-shadow:0 0 12px rgba(217,164,65,.7)}
.icon.gold{background:linear-gradient(135deg,#ffe08a,#d9a441)}
.icon.blue{background:linear-gradient(135deg,#bfe6ff,#4fa3a5)}
.icon.purple{background:linear-gradient(135deg,#e6d4ff,#8e6bd6)}
.topbar{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;pointer-events:none}
.panel{background:rgba(20,20,20,.55);border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:.6rem .9rem;color:#fff;backdrop-filter:blur(4px);max-width:340px}
.panel h1{font:700 1.05rem/1.3 'Marcellus',serif;margin:0 0 .3rem;color:#ffe9a8}
.panel p{margin:.2rem 0;font-size:.95rem;line-height:1.35}
.total{font:700 1.1rem/1 'Marcellus',serif;color:#ffe9a8}
.back{position:absolute;right:12px;top:12px;pointer-events:auto}
.back a{display:inline-block;padding:.5rem .9rem;border-radius:999px;text-decoration:none;color:#3f2c16;background:linear-gradient(135deg,#f7dd93,#d9a441);border:2px solid rgba(107,74,47,.4);font-family:'Marcellus',serif;font-weight:700}
.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(20,20,20,.7);color:#fff;padding:.5rem .9rem;border-radius:10px;border:1px solid rgba(255,255,255,.3);opacity:0;transition:opacity .3s;font-family:'Marcellus',serif}
.toast.show{opacity:1}
@media(max-width:520px){.slot{width:48px;height:48px}.slot .icon{width:28px;height:28px}.panel{max-width:260px;font-size:.9rem}}
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="topbar">
    <div class="panel">
      <h1>Академия знаний — демо добычи</h1>
      <p>Коснитесь или кликните по светящемуся блоку, чтобы добыть ресурс.</p>
      <p>Перетаскивайте палец/мышь, чтобы осмотреться.</p>
      <p>Собрано всего: <span class="total" id="total">0</span></p>
    </div>
    <div class="back"><a href="index.html">← На карту</a></div>
  </div>
  <div class="crosshair"></div>
  <div class="hotbar" id="hotbar">
    <div class="slot active" data-type="gold"><div class="icon gold"></div><span class="count" id="c-gold">0</span></div>
    <div class="slot" data-type="blue"><div class="icon blue"></div><span class="count" id="c-blue">0</span></div>
    <div class="slot" data-type="purple"><div class="icon purple"></div><span class="count" id="c-purple">0</span></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>
<script>
(function(){
'use strict';
const canvas=document.createElement('canvas');
document.getElementById('app').appendChild(canvas);

const app=new pc.Application(canvas,{
  graphicsDeviceOptions:{antialias:true,alpha:false}
});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
app.start();

// Сцена и камера
const scene=app.scene;
scene.ambientLight=new pc.Color(0.35,0.35,0.4);
scene.fogColor=new pc.Color(0.55,0.62,0.72);
scene.fogStart=30;scene.fogEnd=90;

const camera=new pc.Entity('camera');
camera.addComponent('camera',{fov:60,near:0.1,far:200,clearColor:new pc.Color(0.55,0.62,0.72)});
app.root.addChild(camera);

const light=new pc.Entity('light');
light.addComponent('light',{type:'directional',color:new pc.Color(1,0.95,0.8),intensity:1.2,castShadows:false});
light.setEulerAngles(45,30,0);
app.root.addChild(light);

// Материалы
function mat(color,emissive){
  const m=new pc.StandardMaterial();
  m.diffuse=new pc.Color(color[0],color[1],color[2]);
  if(emissive){m.emissive=new pc.Color(emissive[0],emissive[1],emissive[2]);m.emissiveIntensity=0.8;}
  m.update();
  return m;
}
const grassMat=mat([0.42,0.62,0.35]);
const dirtMat=mat([0.45,0.32,0.2]);
const goldMat=mat([0.85,0.65,0.25],[0.5,0.35,0.1]);
const blueMat=mat([0.4,0.7,0.8],[0.1,0.35,0.45]);
const purpleMat=mat([0.6,0.45,0.85],[0.25,0.15,0.45]);

// Мир: земля 12x12, трава сверху
const world=new pc.Entity('world');
app.root.addChild(world);
const SIZE=12;
for(let x=-SIZE/2;x<SIZE/2;x++){
  for(let z=-SIZE/2;z<SIZE/2;z++){
    const e=new pc.Entity();
    e.addComponent('render',{type:'box',material:grassMat});
    e.setLocalPosition(x,0,z);
    e.setLocalScale(1,1,1);
    world.addChild(e);
  }
}

// Руды: 12 блоков, 3 типа
const ores=[];
const types=[
  {key:'gold',mat:goldMat,color:[0.85,0.65,0.25]},
  {key:'blue',mat:blueMat,color:[0.4,0.7,0.8]},
  {key:'purple',mat:purpleMat,color:[0.6,0.45,0.85]}
];
for(let i=0;i<12;i++){
  const t=types[i%3];
  const e=new pc.Entity('ore_'+i);
  e.addComponent('render',{type:'box',material:t.mat});
  const x=(Math.random()-0.5)*(SIZE-2);
  const z=(Math.random()-0.5)*(SIZE-2);
  e.setLocalPosition(x,1,z);
  e.setLocalScale(0.9,0.9,0.9);
  e.userData={type:t.key,alive:true};
  world.addChild(e);
  ores.push(e);
}

// Инвентарь
const inv={gold:0,blue:0,purple:0};
function updateHUD(){
  document.getElementById('c-gold').textContent=inv.gold;
  document.getElementById('c-blue').textContent=inv.blue;
  document.getElementById('c-purple').textContent=inv.purple;
  const total=inv.gold+inv.blue+inv.purple;
  document.getElementById('total').textContent=total;
}
updateHUD();

function toast(text){
  const el=document.getElementById('toast');
  el.textContent=text;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1200);
}

// Управление камерой: орбита
let yaw=0,pitch=0.5,dist=16;
const target=new pc.Vec3(0,1,0);
function updateCamera(){
  const x=target.x+dist*Math.sin(yaw)*Math.cos(pitch);
  const y=target.y+dist*Math.sin(pitch);
  const z=target.z+dist*Math.cos(yaw)*Math.cos(pitch);
  camera.setLocalPosition(x,y,z);
  camera.lookAt(target);
}
updateCamera();

// Ввод: перетаскивание и добыча
let dragging=false,lastX=0,lastY=0,moved=false;
function onDown(e){
  dragging=true;moved=false;lastX=e.clientX;lastY=e.clientY;
}
function onMove(e){
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
  yaw-=dx*0.005;pitch=Math.min(1.2,Math.max(0.1,pitch+dy*0.004));
  lastX=e.clientX;lastY=e.clientY;
  updateCamera();
}
function onUp(e){
  dragging=false;
  if(!moved)mineAt(e.clientX,e.clientY);
}
function mineAt(cx,cy){
  // Луч из камеры через точку экрана
  const ndcX=(cx/window.innerWidth)*2-1;
  const ndcY=1-(cy/window.innerHeight)*2;
  const camPos=camera.getLocalPosition().clone();
  const dir=new pc.Vec3();
  // Приближенно: направление к точке на плоскости перед камерой
  const forward=new pc.Vec3();
  camera.getWorldTransform().transformVector(new pc.Vec3(0,0,-1),forward);
  const right=new pc.Vec3();
  camera.getWorldTransform().transformVector(new pc.Vec3(1,0,0),right);
  const up=new pc.Vec3();
  camera.getWorldTransform().transformVector(new pc.Vec3(0,1,0),up);
  const fov=60*Math.PI/180;
  const tanF=Math.tan(fov/2);
  const aspect=window.innerWidth/window.innerHeight;
  dir.copy(forward)
    .add(right.clone().scale(ndcX*tanF*aspect))
    .add(up.clone().scale(ndcY*tanF))
    .normalize();
  // Поиск ближайшей руды вдоль луча
  let best=null,bestT=Infinity;
  ores.forEach(o=>{
    if(!o.userData.alive)return;
    const p=o.getLocalPosition().clone();
    const toObj=p.clone().sub(camPos);
    const t=toObj.dot(dir);
    if(t<0)return;
    const closest=camPos.clone().add(dir.clone().scale(t));
    const d=closest.distance(p);
    if(d<0.75&&t<bestT){best=o;bestT=t;}
  });
  if(best){
    best.userData.alive=false;
    inv[best.userData.type]++;
    updateHUD();
    toast('Добыт ресурс: '+best.userData.type);
    // Анимация исчезновения
    let s=1;
    const shrink=()=>{
      s-=0.15;
      if(s<=0){world.removeChild(best);return;}
      best.setLocalScale(s,s,s);
      requestAnimationFrame(shrink);
    };
    shrink();
  }else{
    toast('Мимо. Ищите светящиеся блоки.');
  }
}

canvas.addEventListener('pointerdown',onDown);
window.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];onDown(t);},{passive:true});
window.addEventListener('touchmove',e=>{const t=e.touches[0];onMove(t);},{passive:true});
window.addEventListener('touchend',e=>{onUp(e.changedTouches[0]);},{passive:true});

// Ресайз
window.addEventListener('resize',()=>{
  app.resizeCanvas(window.innerWidth,window.innerHeight);
  camera.camera.aspect=window.innerWidth/window.innerHeight;
  camera.camera.updateProjectionMatrix();
});

})();
</script>
</body>
</html>
